[project]
name = "claudecode-telegram"
version = "0.45.0"
description = "Multi-worker AI team orchestration via Telegram"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
claudecode-telegram = "bridge:main"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["tests/", "experiments/"]

[tool.ruff.lint]
select = ["E", "W", "UP", "PLC0415", "I", "ANN", "B", "SIM", "C4", "RUF", "PIE"]
ignore = ["E501", "E741", "B010", "RUF001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_any_explicit = true
check_untyped_defs = true
ignore_missing_imports = true
